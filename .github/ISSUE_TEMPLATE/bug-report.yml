name: Bug report
description: Something doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the report! **If this is a security issue** (auth bypass,
        XSS, path traversal, …) please
        [report it privately](https://github.com/wrotek/painapple-code/security/advisories/new)
        instead — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >-
        What did you do, what did you expect, what happened instead? Steps to
        reproduce help enormously.
      placeholder: |
        1. Open a session on …
        2. Click …
        3. Expected …, got …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`painapple -v`, or the version shown on the welcome screen."
      placeholder: v1.0.0-rc34
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How is it installed?
      options:
        - pip / pipx
        - Docker or Podman (image / --in-docker)
        - Dev Container Feature / Codespace
        - From source (git checkout)
    validations:
      required: true
  - type: input
    id: server-os
    attributes:
      label: Server OS
      placeholder: Ubuntu 24.04 / macOS 15 / Windows 11 (native or WSL2)
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client (if UI-related)
      description: Browser or PWA, and the device.
      placeholder: iPad PWA / Safari on macOS / Chrome on Windows …
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        `~/.painapple-code/logs/error.log` and `server.log` (or
        `painapple logs [NAME]` / `docker logs`). **Strip anything
        sensitive** — tokens, passwords, private paths.
      render: text
