name: Sync Docker Hub README

# Pushes README.dockerhub.md to the Docker Hub repo's Overview tab and
# updates its short description.
#
# This used to be a job inside docker-publish.yml gated on
# `startsWith(ref,'refs/tags/v') && !contains(ref,'-')` — stable releases
# only. Since the very first tag ever pushed was v1.0.0-rc1, that gate
# never once opened: the Overview tab sat empty for months while every
# release note said otherwise. Same failure shape as the frozen :latest
# tag — a rule that quietly presumed a stable release had already shipped.
#
# The Overview tab is not a versioned artifact. Docker Hub stores exactly
# one description per repo, always showing the newest thing pushed to it,
# so there is nothing for a release tag to pin. It's documentation, and it
# tracks main — same trigger shape as docs.yml, which deploys the docs
# site. Decoupling it from the image build also means a typo fix no longer
# waits on a 20-minute multi-arch build to publish.
#
# Required repository secrets:
#   - DOCKERHUB_USERNAME       (wrotek)
#   - DOCKERHUB_README_TOKEN   Hub PAT with "Read, Write, Delete" scope.
#                              Falls back to DOCKERHUB_TOKEN if unset.
#
# The scope requirement is verified, not folklore: a "Read & Write" token
# authenticates fine (the action logs "Acquiring token") and then the
# PATCH comes back 403 Forbidden. It reads like a permission to delete
# your readme; it isn't. Hub's PAT scopes are REGISTRY scopes — pull,
# push, delete images. The Overview tab lives behind the separate account
# API (hub.docker.com/v2/repositories/…), which was password-only for
# years; when Docker retrofitted PAT support they added no
# "repo metadata" scope and simply mapped it to the top of the existing
# ladder. So "Delete" here means "full account access".
#
# Hence the separate secret. That scope lets its bearer delete tags and
# repositories, which is a poor trade for editing text — so keep
# DOCKERHUB_TOKEN narrow (Read & Write is all a push needs) and give the
# wide scope only to this workflow, where it can be revoked on its own
# without touching releases.

# Deliberately ungated. v1.0.0-rc17 was cut from the very commit that
# added this workflow and still didn't sync, because a `branches: [main]`
# filter does not match a tag push — the release went out as
# refs/tags/v1.0.0-rc17 and this never fired. A `paths:` filter would
# have been a third gate to get wrong (and behaves murkily on tag
# pushes). Every gate this file has ever had has been the reason it
# didn't run, so: any push to main, any release tag, or on demand. The
# job takes ~15s and the API call is idempotent — staleness is the only
# real failure mode here, and cleverness is what caused it twice.
on:
    push:
        branches: [main]
        tags: ["v*.*.*"]
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            # README.dockerhub.md is generated by docs-ai/readme/compose.sh
            # from gitignored section sources. If someone deletes it, the
            # action's failure is an opaque API error — say it plainly here.
            - name: Check the readme exists
              run: |
                  if [[ ! -s README.dockerhub.md ]]; then
                      echo "✗ README.dockerhub.md is missing or empty."
                      echo "  Regenerate it: docs-ai/readme/compose.sh dockerhub"
                      exit 1
                  fi
                  echo "→ $(wc -l < README.dockerhub.md) lines to publish"

            - name: Sync Docker Hub description
              id: sync
              uses: peter-evans/dockerhub-description@v5
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  # Prefer the dedicated wide-scope token; fall back to the
                  # publishing one so this keeps working if only one exists.
                  password: ${{ secrets.DOCKERHUB_README_TOKEN || secrets.DOCKERHUB_TOKEN }}
                  repository: wrotek/painapple-code
                  short-description: "WebSocket bridge that serves a vanilla-JS PWA for Claude Code sessions"
                  # Without this the action publishes ./README.md — the
                  # GitHub one, which is a different document.
                  readme-filepath: ./README.dockerhub.md
                  # Rewrites relative links (e.g. [LICENSE](LICENSE)) into
                  # absolute github.com URLs so they resolve on the Hub page.
                  enable-url-completion: true

            # The action fails with a bare "Error: Forbidden" and no
            # remedy, which cost a full debugging round once already.
            # Translate it while the context is still on screen.
            - name: Explain a scope failure
              if: failure()
              run: |
                  echo "The PATCH was refused — almost certainly token scope."
                  echo
                  echo "A 'Read & Write' PAT authenticates (you'll see"
                  echo "'Acquiring token' succeed) and is then rejected 403 by"
                  echo "the description API, which needs 'Read, Write, Delete'."
                  echo
                  echo "Fix: hub.docker.com -> avatar -> Account settings ->"
                  echo "Personal access tokens -> Generate, scope"
                  echo "'Read, Write, Delete'. Store it as the repo secret"
                  echo "DOCKERHUB_README_TOKEN (leave DOCKERHUB_TOKEN narrow —"
                  echo "pushing images only needs Read & Write)."
                  echo
                  echo "If username is not a repo Admin, that also 403s."
