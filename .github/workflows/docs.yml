name: Docs

# Builds the MkDocs Material site from docs-site/ and deploys it to
# GitHub Pages. Runs on every push to main that touches the docs, and
# on manual dispatch.
#
# Pages is auto-provisioned by the `actions/configure-pages` step below
# (enablement: true), so no manual Settings → Pages toggle is required —
# the first successful run creates the Pages site via the API. If your
# org disallows API enablement, set it manually: repo Settings → Pages →
# Source: "GitHub Actions".

on:
    push:
        branches: [main]
        paths:
            - "docs-site/**"
            - "mkdocs.yml"
            - "requirements-docs.txt"
            - ".github/workflows/docs.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: docs-pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Configure Pages
              uses: actions/configure-pages@v5
              with:
                  enablement: true

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install docs toolchain
              run: pip install -r requirements-docs.txt

            - name: Build site
              run: mkdocs build --strict

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site/

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
