name: Publish to PyPI

# Builds the sdist + wheel and publishes them to PyPI, then creates a
# GitHub Release for the tag.
#
# Versioning: same scheme as docker-publish.yml — the git tag (vX.Y.Z)
# is the single source of truth; setuptools-scm derives the package
# version from it at build time.
#
# Auth: PyPI Trusted Publishing (OIDC) — no API token secrets. One-time
# setup on pypi.org: add a publisher for project `painapple-code` with
#   owner: wrotek, repo: painapple-code,
#   workflow: pypi-publish.yml, environment: pypi
# Pre-release tags (v1.1.0-rc1) publish to PyPI as 1.1.0rc1 (pip only
# installs those with --pre) and are marked pre-release on GitHub.

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # fetch-depth: 0 so setuptools-scm can `git describe` against
            # all tags. Default shallow clone hides everything but HEAD.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            # The frontend bundle is a build artifact, not a committed one: it
            # changes on every frontend edit and would bloat the history. It is
            # gitignored, so it must be generated here — package-data globs the
            # filesystem, so a present static/dist/ lands in the wheel.
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "20"

            # Same script a from-source deploy runs, so there is one build path
            # and CI exercises it. Installs only esbuild + yaml (~7 MB).
            - name: Build frontend bundle
              run: ./build-frontend.sh

            - name: Build sdist and wheel
              run: |
                  pip install --quiet build
                  python -m build
                  ls -l dist/
                  python - <<'PY'
                  import pathlib, zipfile, sys
                  whl = sorted(pathlib.Path("dist").glob("*.whl"))[-1]
                  names = zipfile.ZipFile(whl).namelist()
                  if not any(n.endswith("static/dist/app.bundle.js") for n in names):
                      sys.exit(f"{whl.name} is missing the frontend bundle")
                  print(f"{whl.name} ships the frontend bundle")
                  PY

            # Sanity check: the version baked into the wheel must match the
            # tag that triggered us (v1.2.3 → 1.2.3, v1.2.3-rc1 → 1.2.3rc1).
            - name: Verify version matches tag
              run: |
                  tag="${GITHUB_REF#refs/tags/v}"
                  expected=$(python -c "from packaging.version import Version; import sys; print(Version(sys.argv[1]))" "$tag")
                  built=$(ls dist/*.whl | sed -E 's|dist/painapple_code-([^-]+)-.*|\1|')
                  echo "tag=$expected built=$built"
                  test "$expected" = "$built"

            # Licensing gate. painapple-code is AGPL-3.0-or-later, and
            # requirements.txt pins only lower bounds — so the resolved
            # dependency set drifts between releases without any file
            # changing. Install the wheel we just built into a CLEAN venv
            # (not the job's Python, which has build tooling on it) so
            # importlib.metadata sees exactly what a user gets, then fail
            # on any license outside the allowlist in the script.
            - name: Verify dependency licenses
              run: |
                  python -m venv /tmp/licvenv
                  /tmp/licvenv/bin/pip install --quiet --upgrade pip
                  /tmp/licvenv/bin/pip install --quiet dist/*.whl
                  /tmp/licvenv/bin/python tools/check_licenses.py

            # The table for THIRD_PARTY_NOTICES.md, generated from that same
            # clean install. Attached to the run so a release always has an
            # accurate record of what shipped, even though the checked-in
            # notices file is a point-in-time snapshot.
            - name: Generate third-party license table
              run: |
                  /tmp/licvenv/bin/python tools/check_licenses.py --table \
                      > third-party-licenses.md
                  cat third-party-licenses.md >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/

            - uses: actions/upload-artifact@v7
              with:
                  name: third-party-licenses
                  path: third-party-licenses.md

    publish-pypi:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/painapple-code
        permissions:
            id-token: write # OIDC token for Trusted Publishing
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1

    github-release:
        needs: publish-pypi
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  args=(--generate-notes --title "$tag")
                  [[ "$tag" == *-* ]] && args+=(--prerelease)
                  gh release create "$tag" dist/* \
                      --repo "${{ github.repository }}" "${args[@]}"
