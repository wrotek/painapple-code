name: Tests

# Runs the tracked pytest suite — which is, deliberately, almost entirely
# security regression tests: CSRF/Origin enforcement, security headers,
# unsafe DOM sinks, path/icon traversal, process-chain collapse, text I/O
# encoding.
#
# Why this exists: those tests were written to prove the S1-S4 / WP-02..WP-06
# hardening actually holds, but for a while nothing ran them. A suite that
# no pipeline executes is documentation, not a gate — a future PR could
# reintroduce an XSS sink or drop the Origin check and every workflow would
# still be green. This is the gate.
#
# The suite is in-process (FastAPI TestClient against create_app(), with
# every fixture writing to tmp_path) so it needs no live server, no port,
# and no ~/.config credentials. It runs in about a second.
#
# Note `tests/` is blanket-gitignored; the security modules are force-added
# individually. If you add a test, `git add -f` it or CI will silently not
# see it.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    # Reusable entry point: both publish workflows call this suite as their
    # release gate (needs: test), so a tag push cannot reach PyPI or Docker
    # Hub without the security regression tests passing. The push/PR
    # triggers above are unchanged — this is additive.
    workflow_call:
        inputs:
            ref:
                description: >-
                    Ref to test. Callers rebuilding an existing tag via
                    dispatch pass it here so the gate tests the tag's tree,
                    not the branch. Empty = the triggering ref, as always.
                required: false
                type: string

permissions:
    contents: read

# github.workflow is the CALLER's workflow name in a workflow_call run, so
# the two publish workflows testing the same tag get distinct groups and
# cannot cancel each other's gate (ref alone would collide them).
concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pytest:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13"]
        steps:
            # fetch-depth: 0 so setuptools-scm can resolve a version from
            # tags rather than falling back to 0.1.devN.
            # ref is empty for every trigger except a workflow_call that
            # passes one — checkout treats empty as "the triggering ref".
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.ref }}

            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install package + test deps
              run: python -m pip install .[test]

            - name: Run test suite
              run: python -m pytest tests/ -q --durations=10
