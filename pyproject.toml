# setuptools>=77 is required for the PEP 639 SPDX `license = "..."`
# expression below. With older setuptools the license string is silently
# dropped from the wheel metadata.
[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "painapple-code"
description = "Self-hosted remote UI for Claude Code that journals every turn - background AI summaries become shadow-git commits and a queryable DuckDB history"
readme = "README.md"
requires-python = ">=3.12"
# version is resolved at build time by setuptools-scm from git tags;
# dependencies are read from requirements.txt below.
dynamic = ["version", "dependencies"]
authors = [{name = "Michal Booth-Wrotkowski", email = "michal@boothw.com"}]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["claude", "claude-code", "websocket", "bridge", "pwa", "ipad", "remote", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Homepage = "https://painapple.ai"
Documentation = "https://painapple.ai"
Source = "https://github.com/wrotek/painapple-code"
Issues = "https://github.com/wrotek/painapple-code/issues"

[project.scripts]
painapple = "painapple_code.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

# Ship the non-Python runtime assets alongside the package so a wheel
# install is self-contained. Server code resolves these via PACKAGE_DIR.
[tool.setuptools.package-data]
painapple_code = [
    "static/**/*",
    "data/**/*",
    "tools/**/*",
]

# Version derived from `git describe` against tags like vMAJOR.MINOR.PATCH
# (SemVer, e.g. v0.1.0). Writes the resolved version into _version.py so
# the installed package can expose __version__ without re-running git at
# import time. fallback_version covers fresh clones with no tags fetched
# and Docker builds where .git is excluded — those override via the env
# var SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PAINAPPLE_CODE.
[tool.setuptools_scm]
version_file = "src/painapple_code/_version.py"
fallback_version = "0.0.0+unknown"
# Only vX.Y.Z release tags determine the version (deploy.fish creates them,
# bumping patch/minor/major); any other tag shape is ignored.
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"
