# setuptools>=77 is required for the PEP 639 SPDX `license = "..."`
# expression below. With older setuptools the license string is silently
# dropped from the wheel metadata.
[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "painapple-code"
description = "Self-hosted remote UI for Claude Code that journals every turn - background AI summaries become shadow-git commits and a queryable DuckDB history"
readme = "README.md"
requires-python = ">=3.12"
# version is resolved at build time by setuptools-scm from git tags;
# dependencies are read from requirements.txt below.
dynamic = ["version", "dependencies"]
authors = [{name = "Michał Booth-Wrotkowski", email = "michal@boothw.com"}]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["claude", "claude-code", "websocket", "pwa", "ipad", "remote", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

# Test-only deps. The suite drives the app in-process via FastAPI's
# TestClient (httpx is already a runtime dep), so `pip install .[test]`
# is all CI or a contributor needs — no live server, no port binding.
[project.optional-dependencies]
test = ["pytest>=8.0"]
# TLS support on the platforms pyca/cryptography abandoned. On every other
# platform cryptography is already a base dependency and this extra just
# restates the same floor (a test asserts the two stay in sync) — so
# `painapple-code[tls]` is a no-op there and the correct thing to install
# anywhere.
#
# On the abandoned platforms it pins the last version that still publishes a
# wheel, which means NO Rust toolchain is needed but DOES mean cryptography
# versions with known advisories. That trade is why this is opt-in: the
# default install simply omits cryptography there and `--tls` explains itself
# (see _tls_unavailable in server.py). None of those advisories are reachable
# through tls_cert.py, which only generates a self-signed ECDSA P-256 cert —
# they are in the X.509 verifier, PKCS#7 and symmetric-cipher paths we never
# call — but "unreachable today" is not a promise we want in a default install.
tls = [
    "cryptography>=50.0.0; (platform_machine != \"ARM64\" or sys_platform != \"win32\") and (platform_machine != \"x86_64\" or sys_platform != \"darwin\")",
    # Windows/ARM64: 46.0.3 is the last win_arm64 wheel. Expected to be
    # unnecessary once pyca/cryptography#15350 lands and restores the platform.
    "cryptography>=43.0.1,<=46.0.3; platform_machine == \"ARM64\" and sys_platform == \"win32\"",
    # macOS/Intel: 48.0.1 is the last universal2 wheel; 49.0.0 went arm64-only.
    "cryptography>=43.0.1,<49; platform_machine == \"x86_64\" and sys_platform == \"darwin\"",
]

[project.urls]
Homepage = "https://painapple.ai"
Documentation = "https://painapple.ai"
Source = "https://github.com/wrotek/painapple-code"
Issues = "https://github.com/wrotek/painapple-code/issues"

[project.scripts]
painapple = "painapple_code.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

# Ship the non-Python runtime assets alongside the package so a wheel
# install is self-contained. Server code resolves these via PACKAGE_DIR.
[tool.setuptools.package-data]
painapple_code = [
    "static/**/*",
    "data/**/*",
    "tools/**/*",
]

# Version derived from `git describe` against tags like vMAJOR.MINOR.PATCH
# (SemVer, e.g. v0.1.0). Writes the resolved version into _version.py so
# the installed package can expose __version__ without re-running git at
# import time. fallback_version covers fresh clones with no tags fetched
# and Docker builds where .git is excluded — those override via the env
# var SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PAINAPPLE_CODE.
[tool.setuptools_scm]
version_file = "src/painapple_code/_version.py"
fallback_version = "0.0.0+unknown"
# Only vX.Y.Z release tags determine the version (deploy.fish creates them,
# bumping patch/minor/major); any other tag shape is ignored.
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"
