# ============================================================
# Helpers install (shadow-git CLI + agent template)
# Pill is always visible — clicking opens a modal that explains the
# auto-journal feature and offers install / update / reinstall.
# ============================================================
helpers:
  pill:
    # The pill names the RECORDING state, not the helper-file state — a
    # project that isn't journalling says so regardless of what's installed.
    # Helper labels only surface while recording is on.
    recording: "Auto-journal on"
    basic: "Auto-journal basic"
    # Key is `disabled`, not `off`: YAML 1.1 coerces a bare `off:` key into
    # the boolean False, which PyYAML then serialises as the JSON key
    # "false" — the string silently disappears from S.helpers.pill.off.
    disabled: "Auto-journal off"
    # Shown before the project's config is known (first paint, no project
    # open) — states no opinion on whether recording is happening.
    unknown: "Auto-journal"
    not_installed: "Helpers not installed"
    outdated: "Helpers outdated"
    tooltip: "Auto-journal — tap to configure"
  modal:
    title_current: "Auto-journal is active"
    title_missing: "Set up auto-journal"
    title_outdated: "Update auto-journal helpers"
    body_intro_lead: "Two layers run together to keep a record of your work:"
    body_intro_shadow: "File history silently versions every file Claude touches into a separate git history — so you can undo, diff, or browse what changed turn-by-turn without polluting your real repo."
    body_intro_rich: "Rich commits is a {model} fork that runs after each turn and adds metadata to those commits — a summary, tags, decisions, findings, files touched. Lets you search by intent, not just diff."
    body_intro_outro: "Browse it from the Journal panel, query it from the terminal, or have a subagent dig through it."
    body_current: |
      Both helpers are installed and up to date. Re-run install to
      overwrite any local edits with the bundled versions.
    body_missing: |
      The helpers above are not installed yet. Installing copies the
      files into your home directory — no sudo, no PATH changes. The
      install runs on the server's filesystem, not your iPad/laptop.
    body_outdated: |
      Your installed helpers are out of date with the bundled versions.
      Update to keep the installed copies in sync.
    install_btn: "Install"
    update_btn: "Update"
    reinstall_btn: "Reinstall"
    uninstall_btn: "Uninstall"
    uninstall_confirm_btn: "Click again to confirm"
    open_journal_btn: "Open Journal"
    cancel_btn: "Not now"
    close_btn: "Close"
    dont_show: "Don't show again (until next update)"
    installing: "Installing…"
    uninstalling: "Removing helpers…"
    success: "Installed successfully."
    uninstalled: "Helpers removed."
    failure: "Install failed — see log below."
    uninstall_failure: "Uninstall failed — see log below."
    section_project: "This project"
    section_defaults: "New projects"
    section_defaults_hint: "Applied to projects you open from now on. Each project can still override it above."
    section_helpers: "Optional helpers"
    section_helpers_hint: "Auto-journal records regardless. These helpers add ways to query it."
    helpers_usage_example: "Type <code>#</code> in chat → pick <code>shadow-git-helper</code> to summon a subagent that searches your journal. Or run <code>{cmd}</code> in the terminal."
    helpers_usage_example_agent_only: "Type <code>#</code> in chat → pick <code>shadow-git-helper</code> to summon a subagent that searches your journal."
    helpers_status_missing: "Not installed"
    helpers_status_unsupported: "Not available here"
