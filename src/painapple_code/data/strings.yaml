# strings.yaml - All user-facing text for pAInapple Code
# Edit this file to change UI text without touching code.
# Served as ES module at /static/js/strings.js (YAML -> JS on-the-fly)

# ============================================================
# Prompts sent to Claude CLI
# ============================================================
prompts:
  agents:
    default_pattern: "Consult with agent {agent} "

# ============================================================
# Permission system
# ============================================================
permissions:
  header: "Permission Level"
  tooltip_template: "Permissions: {label} ({desc})"
  deny_short: "Permission denied — {tool} blocked in {mode} mode."
  deny_explainer: "Claude tried to use {tool}{details} but was blocked by {mode} permission mode. To allow it, change the permission level using the button next to the message input."
  order: [plan, dontAsk, acceptEdits, auto, bypassPermissions]
  levels:
    bypassPermissions:
      label: "YOLO"
      popup_label: "YOLO"
      tooltip: "Permissions: YOLO (all allowed)"
      description: "Skip all permission checks"
      color: "#4ade80"
    acceptEdits:
      label: "Accept Edits"
      popup_label: "Accept Edits"
      tooltip: "Permissions: Accept Edits (workspace edits only)"
      description: "Auto-approve workspace edits; others prompt for approval"
      color: "#fb923c"
    auto:
      label: "Auto"
      popup_label: "Auto"
      tooltip: "Permissions: Auto (AI classifier gates each action)"
      description: "AI classifier reviews each tool call"
      color: "#60a5fa"
    dontAsk:
      label: "Don't Ask"
      popup_label: "Don't Ask"
      tooltip: "Permissions: Don't Ask (deny unless pre-approved)"
      description: "Auto-deny unless in allow rules"
      color: "#facc15"
    plan:
      label: "Plan"
      popup_label: "Plan"
      tooltip: "Permissions: Plan (read-only)"
      description: "Read-only, explore & design"
      color: "#8b5cf6"

