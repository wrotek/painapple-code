<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=contain, not cover: in-place nav leaks cover-mode into the chat UI →
         empty bottom bar on iPad/iPhone. Keep all app surfaces non-cover (see web-client.html). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=contain">
    <meta name="theme-color" content="#0d1117">
    <title>Sign in &middot; pAInapple Code</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <main class="login-shell">
        <div class="login-card">
            <h1 class="login-title">pAInapple Code</h1>
            <p class="login-subtitle">Sign in to continue</p>
            <!-- method="post" is defense-in-depth, not the submit path:
                 login.js preventDefault()s and POSTs JSON to /api/login.
                 But if that script ever fails to load, the native fallback
                 must not be a GET — that would put the password in the
                 query string and the access log. A POST to this GET-only
                 route 405s: visibly broken, credential intact. -->
            <form id="login-form" method="post" novalidate>
                <label for="password" class="login-label">Password</label>
                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password"
                       autofocus
                       required>
                <button type="submit" class="login-submit">Sign in</button>
                <p id="error" class="login-error" role="alert" hidden></p>
            </form>
            <div class="login-hint">
                <p class="login-hint-label" id="reveal-label">Reveal the password from your terminal:</p>
                <button type="button"
                        class="login-cmd"
                        id="reveal-cmd"
                        title="Click to copy">
                    <code></code>
                    <span class="login-cmd-status" aria-live="polite">Copy</span>
                </button>
            </div>
        </div>
    </main>
    <!-- Server-filled config. Non-JS type = data block, never executed,
         so CSP script-src does not gate it. Read by js/login.js. -->
    <script type="application/json" id="login-config">null</script>
    <script src="/static/js/login.js"></script>
</body>
</html>
